[project]
name = "predicting-smartphone-addiction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Kaggle 커널 이미지가 Python 3.12라 하한을 3.12로 둔다(#58 GPU 실행 경로).
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    # TabR(#199)의 CUDA exact 검색 경로. Linux GPU 원격 환경에서만 설치된다.
    "faiss-gpu-cu12==1.14.1; sys_platform == 'linux'",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.6",
    "numpy>=2.5.2",
    "optuna>=4.6.0",
    "packaging>=26.3",
    "pandas>=3.0.5",
    "pyarrow>=20",
    "psutil>=7.2.2",
    "pytabkit>=1.7.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tabicl==2.1.1",
    "tabpfn==8.3.0",
    "torch>=2.5",
    "xgboost>=3.4.0",
    "xrfm==0.4.5",
]

# mlflow 3.x는 pandas<3을 선언하지만 이 프로젝트의 사용 범위(로컬 file store 기록)에서는 pandas 3과 동작한다.
# mlflow가 pandas 3 지원을 선언하면 이 재정의는 제거한다.
[tool.uv]
override-dependencies = ["pandas>=3.0.5"]

# src/pipeline 패키지를 `python -m pipeline.run`으로 실행하기 위한 최소 패키징.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/remote_ops"]

[tool.pytest.ini_options]
addopts = ["-p", "pipeline.pytest_openmp_guard"]
testpaths = ["tests"]
