[project]
name = "predicting-smartphone-addiction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.6",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=20",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.5",
    "xgboost>=3.4.0",
]

# mlflow 3.x는 pandas<3을 선언하지만 이 프로젝트의 사용 범위(로컬 file store 기록)에서는 pandas 3과 동작한다.
# mlflow가 pandas 3 지원을 선언하면 이 재정의는 제거한다.
[tool.uv]
override-dependencies = ["pandas>=3.0.5"]

# src/pipeline 패키지를 `python -m pipeline.run`으로 실행하기 위한 최소 패키징.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
