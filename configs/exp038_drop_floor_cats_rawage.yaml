# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #79: 플라시보 미달 피처 제거 변형 (b). 변형 (a)의 3종에 raw age를 더해 뺀다.
# age는 전 실행에서 raw가 플라시보 미달이지만 age_te는 통과하므로,
# raw 표현만 잉여라는 가설을 확인한다(age_te는 TE 목록에 그대로 유지).
# 그 외는 champion exp026과 동일. 피처 제거 실험이라 새 피처 게이트는 해당 없음.
# seed 42 스크리닝(run a6b7d2c2)은 +0.00001로 통과했으나 변형 (a)(+0.00003)보다
# 약해 확정 재검증은 (a)만 보낸다. raw age 추가 제거는 이득을 더하지 못했다.

name: exp038_drop_floor_cats_rawage

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  exclude: [gender, stress_level, academic_work_impact, age]
  categorical: []
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
