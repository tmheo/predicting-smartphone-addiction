# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #90: 복원 행렬 조성 피처의 2차 축소 대리 스크리닝. exp055(run 6fa5d5ad)는
# OOF +0.00018이었지만 free_time이 중요도 재분배로 플라시보 아래로 떨어져 미달
# (exp054에서는 상회). 상회 5열(social_frac, work_frac, leisure_frac, resid_frac,
# week_total)만 남긴다. 경계 열은 leisure_frac(플라시보의 1.08배)이며, 이번에도
# 새 미달이 나오면 축소 반복은 여기서 멈추고 미달로 종결한다.
# 기준 실행은 exp051(run f139eeec4b2c495a9aeab56aba3ec665).
name: exp056_lgb_xgb_impute_comps5

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
