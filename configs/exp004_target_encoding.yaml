# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #33 설계, #34 실행: champion exp003 구성 위에 정확값 타깃 인코딩 <col>_te를 추가 전용으로 얹는다.
# 수치 9개 + placebo_noise를 fold 루프 안 fold-fit 단계에서 인코딩한다.
# placebo_noise_te는 누수 카나리아 전용으로, 개선 판정의 새 피처에서 제외된다.

name: exp004_target_encoding

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  categorical_copies:
    [
      age,
      daily_screen_time_hours,
      social_media_hours,
      gaming_hours,
      work_study_hours,
      sleep_hours,
      notifications_per_day,
      app_opens_per_day,
      weekend_screen_time,
    ]
  placebo: true
  fold_fit:
    - kind: target_encoding
      # 바깥쪽 학습 fold 안에서 내부 층화 10-fold OOF로 학습 행 인코딩. (#33)
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
