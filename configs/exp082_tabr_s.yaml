# 이슈 #142: TabR-S의 champion 교체 및 후보 풀 다양성 기여 결정.
# exp067_lookup_xgb_impute_comps5의 33개 피처를 그대로 사용한다.
# 공식 TabR-S 기본 구조, 문맥 96개, 첫 epoch 뒤 문맥 고정을 사용한다.
# 진입 진단과 seed 42 5-fold는 같은 두 epoch 설정을 공유한다.
name: exp082_tabr_s

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [social_frac, work_frac, leisure_frac, resid_frac, week_total]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabr_s
  params:
    context_size: 96
    freeze_contexts_after_n_epochs: 1
    epochs: 2
    batch_size: 1024
    eval_batch_size: 8192
    candidate_encoding_batch_size: 65536
    d_main: 265
    d_multiplier: 2.0
    context_dropout: 0.38920071545944357
    dropout0: 0.38852797479169876
    dropout1: 0.0
    lr: 0.0003121273641315169
    weight_decay: 0.0000012260352006404615
    perm_sample: 8192
    perm_repeats: 1
  fit: {}
