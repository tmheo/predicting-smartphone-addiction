# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #183: 공개 스택 재현 4순위의 no-TE 뷰 XGBoost 판.
# 채택 트리 구성 exp045_xgb_depth8에서 target_encoding 제공자만 뺐고 나머지 피처
# 계획과 모델 설정은 동일하다. 근거와 판정 경로는 exp110_lgb_kitopl_no_te와 같다
# (계열 2, seed 42 스크리닝의 pool 리포트로 진입 하한·중복 게이트 확인).
# 타깃 참조 제공자가 없어 placebo 파생 카나리아는 없다.

name: exp111_xgb_depth8_no_te

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: depthwise
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
  fit:
    early_stopping_rounds: 200
