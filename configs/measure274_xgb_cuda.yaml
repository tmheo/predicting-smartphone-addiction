# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #274(지도 #273 task 티켓): XGBoost `device: cuda` 스모크와 학습 시간
# 실측 전용 설정. 채택 판정용 실험이 아니라 GPU 튜닝 탐색의 실행 설계 입력을
# 만든다. 기준은 XGBoost 재직 구성원 exp111_xgb_depth8_no_te(run f69f33a9,
# seed 42 스크리닝 OOF 0.964416917139336, training 265.409초)이고, 피처 계획과
# 모델 설정은 exp111과 동일하며 device: cuda만 추가했다. 지도 #273의 GPU
# 원칙에 따라 XGBoost는 GPU를 탐색 가속 수단으로만 쓰므로 이 실측은 속도와
# 동작 확인이 목적이고 OOF는 재현성 참고 지표로만 본다.
name: measure274_xgb_cuda

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: depthwise
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
    device: cuda
  fit:
    early_stopping_rounds: 200
