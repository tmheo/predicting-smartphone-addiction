# 이슈 #419: configs/exp048_lgb_orig_cdf_diff.yaml의 관측 학습 길이 15개 중앙값 324 중
# 약 20%인 65회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #87: CatBoost 공식 스크리닝 전에 클래스별 경험적 CDF 차 5열을
# LightGBM으로 대리 스크리닝한다. 기준 실행은 같은 피처·모델·seed 42의
# exp026 run 4b6de022abd54d6c92570c1ea06795d7이다.
name: exp199_issue419_lgb_orig_cdf_diff_fixed20

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_cdf_diff
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          daily_screen_time_hours,
          weekend_screen_time,
          social_media_hours,
          notifications_per_day,
          app_opens_per_day,
        ]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 65
    force_row_wise: true
  fit: {}
