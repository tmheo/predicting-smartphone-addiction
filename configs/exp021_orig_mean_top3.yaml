# 이슈 #53: exp018의 제거 실험. 스크리닝에서 gain importance가 플라시보를 넘은
# 3개 열(notifications, app_opens, work_study)만 남기고 잡음 6개 열을 제거한 변형.
# 스크리닝(seed 42) 단계.

name: exp021_orig_mean_top3

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_prior
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols: [notifications_per_day, app_opens_per_day, work_study_hours]
      stats: [mean]
      smoothing: 20
      unknown: nan
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
