# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #266: exp065 TabM의 격자 TE 조밀화·지정 쌍 키·빈도 열 짝비교.
# exp065_tabm과 모델 설정 및 기존 피처 계획은 동일하고 rich_lattice_encoding만 더한다.
#
# 새 피처 묶음은 szymonkapiski 공개 노트북의 RICH_KEYS를 우리 내부 OOF TE 규율로
# 옮긴다. 고정 판본은 kernel 129458801, SHA-256 95a8fd0e...이며 Apache License 2.0
# 출처와 수정 내역은 RichLatticeEncoder 및 조사 문서에 기록했다.
# - 수치 9열: 소수 첫째 자리 반올림과 정수 내림 키의 평활 TE·셀 개수 36열.
# - 지정 쌍 4종: 수치 열 정수 내림, 범주 열 정확값 키의 평활 TE·셀 개수 8열.
# - 원시 수치·범주 12열: 정확값 키의 셀 개수 12열.
# - placebo 쌍 카나리아의 TE·셀 개수 2열.
# 기존 정확값 TE 9열은 그대로 두며, 새 블록의 학습 행은 TE와 셀 개수 모두 내부
# 10-fold에서 자기 분할을 제외한다. 자기 포함 TE 전환은 이 실험이 통과할 때만 별도 판정.
#
# 판정: Vast.ai seed 42 exp065 짝비교에서 비음수 개선이면 [42, 43, 44] 확정으로
# 확장하고, ADR 0001의 +0.00002 문턱으로 exp065 풀 구성원 교체 여부를 결정한다.
name: exp132_tabm_rich_lattice

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: rich_lattice_encoding
      inner_folds: 10
      smoothing: 10
      raw_cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          gender,
          stress_level,
          academic_work_impact,
        ]
      numeric_cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      pairs:
        [
          [daily_screen_time_hours, weekend_screen_time],
          [social_media_hours, gaming_hours],
          [daily_screen_time_hours, social_media_hours],
          [stress_level, academic_work_impact],
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabm
  params:
    arch_type: tabm-mini-normal
    tabm_k: 16
    num_emb_type: pwl
    d_embedding: 16
    batch_size: 128
    lr: 5.0e-4
    n_epochs: 150
    dropout: 0.02
    d_block: 160
    n_blocks: 10
    weight_decay: 1.0e-2
    patience: 5
    n_seed_avg: 3
    perm_repeats: 2
    perm_sample: 50000
  fit: {}
