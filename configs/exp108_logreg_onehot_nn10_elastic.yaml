# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #200: exp058 변형 1+2 조합 - exp107(orig_nn10_mean 추가)에 elastic-net
# 정규화를 얹는다. fold 0 약식 스윕에서 페널티 단독은 전 설정 +0.00012~14로
# C에 둔감했고(elastic-net 0.5, C=10이 정점), exp107 구성과 조합하면 0.959706으로
# 두 변형의 단순 합(+0.00038)을 넘는 +0.00059가 실측돼 조합을 확정 재검증한다.
# saga는 300회 반복에서 수렴 전이지만 스윕·조합 검증 전부 이 설정의 실측이고,
# 완전 수렴은 fold당 수 시간이라 비용 대비 이득이 없어 고정 300회로 판정한다.
name: exp108_logreg_onehot_nn10_elastic

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: original_knn
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      ks: [10]

model:
  kind: logistic_onehot
  params:
    C: 10.0
    penalty: elasticnet
    l1_ratio: 0.5
    max_iter: 300
    onehot_max_card: 5000
  fit: {}
