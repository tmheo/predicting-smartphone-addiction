# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #59: exp041_cat_depth8(+0.00065 스크리닝 통과)의 용량 축소 변형. CatBoost 기본
# depth 6(대칭 64 leaves)이 depth 8보다 나은지 작은 범위 용량 비교로 확인한다.
# 피처 세트는 champion exp026과 동일.
# seed 42 스크리닝(run 0ef09037)은 +0.00080으로 계열 내 최고(depth 8 +0.00065,
# lr 0.03 +0.00071). 3시드 확정 재검증으로 전환한다.
name: exp043_cat_depth6

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
  fit:
    early_stopping_rounds: 200
