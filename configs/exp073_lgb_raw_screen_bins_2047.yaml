# 이슈 #109: 원시 화면 시간 두 열만 max_bin 2047로 높이는 결과 동일성 대조.
# exp072와 같은 피처 계획과 모델 파라미터에서 두 열의 최대 구간 수만 바꾼다.
# seed 42 run 52ff89d0, OOF AUC 0.9672478475로 exp072와 완전히 같다.
# 두 OOF float64 배열의 최대 절대차는 0이고 SHA-256도 같아 결과 동일성을 확인했다.

name: exp073_lgb_raw_screen_bins_2047

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    max_bin: 1023
    max_bin_by_feature:
      daily_screen_time_hours: 2047
      weekend_screen_time: 2047
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
