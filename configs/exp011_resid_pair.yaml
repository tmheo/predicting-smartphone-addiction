# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #46 채택 champion 계보: other_screen + screen_slack 두 잔차 병행,
# 3시드 확정 재검증 +0.00081, 3/3 시드, 5/5 fold 개선(run e21d19af).
# 이슈 #71에서 피처 계획(base/categorical/providers) 스키마로 재작성.
# placebo는 설정 항목이 아니라 피처 계획의 내장 불변식으로 상시 포함된다.

name: exp011_resid_pair

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    # 재현성 고정(#71): LightGBM이 실행 시점 속도 측정으로 row/col-wise를 골라
    # 같은 설정도 실행마다 bit이 달라진다. champion run e21d19af는 15개 fold 모델
    # 전부 row-wise를 골랐으므로 그 실현값으로 고정한다. 수치 영향 없음.
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
