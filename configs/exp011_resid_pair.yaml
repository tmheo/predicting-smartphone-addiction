# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #46 누적 제거: exp009에서 screen_slack_n_obs만 플라시보 미달(2807 vs 30147).
# other_screen + screen_slack 두 잔차만 병행하는 변형.
# seed 42 스크리닝 +0.00046으로 5개 변형 중 최고, 게이트 전부 통과(run 27a92b2b).
# ADR 0001에 따라 cv.seeds를 3시드로 바꿔 확정 재검증.

name: exp011_resid_pair

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
