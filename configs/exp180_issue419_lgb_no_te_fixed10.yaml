# 이슈 #419: configs/exp110_lgb_kitopl_no_te.yaml의 관측 학습 길이 15개 중앙값 4567 중
# 약 10%인 457회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #183: 공개 스택 재현 4순위의 no-TE 뷰 LightGBM 판.
# 채택 트리 구성 exp074_lgb_kitopl_d2_bundle에서 target_encoding 제공자만 뺐고
# 나머지 피처 계획과 모델 설정은 동일하다. adarsh1077의 178구성원 스택에서 상위
# 계수 4개 중 3개가 no-TE 뷰였다는 README 서술이 근거다(코드 없음, 근거 강도 보통).
# 판정 경로는 계열 2(다양성 구성원)다: 진입 하한과 중복 게이트(스피어만 0.998)를
# seed 42 스크리닝의 pool 리포트로 확인하고, 통과 시에만 3시드 확정으로 넘어간다.
# 타깃 참조 제공자가 없어 placebo 파생 카나리아는 없다.

name: exp180_issue419_lgb_no_te_fixed10

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.03172214617330919
    num_leaves: 45
    min_child_samples: 229
    n_estimators: 457
    max_bin: 1023
    colsample_bytree: 0.4654152088234655
    subsample: 0.9225106784455195
    subsample_freq: 1
    reg_lambda: 0.9179636700368584
    force_row_wise: true
  fit: {}
