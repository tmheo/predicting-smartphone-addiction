# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #106: Lookup-Transformer에서 채택 복원 특성의 한계 기여 결정(복원 블록 실행).
# 기준 exp059_lookup_transformer의 피처 세트(원시 12열 lookup + 파생 6열 PLR)를
# 그대로 두고, CatBoost champion(exp057)에 채택된 복원 블록만 더한다:
# - 제약 결측 재구성(#74): constrained_impute_aux, widths 없음, 9열.
# - XGBoost 조건부 결측 복원(#86): xgb_impute_aux 채택 5열.
# - 복원 행렬 조성(#90): 조성 5열(social_frac, work_frac, leisure_frac,
#   resid_frac, week_total).
# 새 파생 열은 만들지 않는다. 새 열은 전부 lookup_cols 밖이라 PLR 전용 토큰이 된다.
# 정확값 TE는 Lookup 임베딩과의 중복 분리를 위해 별도 실행(exp068)으로 잰다.
# seed 42 스크리닝이 기준 이상이고 새 열 전부 플라시보 상회일 때만 3시드 확정으로 간다.
# 원격 GPU 실행 대상: 주 실행 환경 Runpod RTX A5000(#116), 운영 명세 #118.
name: exp067_lookup_xgb_impute_comps5

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lookup_transformer
  params:
    lookup_cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
  fit: {}
