# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #75: 숫자 열 전체 36쌍 격자 TE 블록의 기여 재검토. #51의 개별 선별 쌍 TE와 달리
# 정수 내림 셀 키로 전 쌍을 일괄 추가하고 각 TE 열 옆에 셀 개수 열을 병행한다
# (szymonkapiski full lattice, docs/research/code-notebook-insights-2.md).
# 평활 m=20과 내부 4-fold는 출처 구성을 따른다. placebo 쌍 카나리아는 자동 포함.
# exp026 champion 베이스에 lattice_pair_te 블록(37쌍 x TE·CT = 74열)만 더한다.
# 0.1 해상도 셀 추가 변형은 exp034로 분리해 따로 잰다.

name: exp034_lattice_te_r1

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: lattice_pair_te
      resolutions: [floor, r1]
      inner_folds: 4
      smoothing: 20
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
