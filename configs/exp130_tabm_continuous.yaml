# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #265: TabM 신경망 전용 연속 특성 확장 짝비교(포화 앵커·GBDT 기각 비율 재개봉).
# exp065_tabm과 모델 설정·피처 계획이 동일하고 xgb_impute_aux compositions만 11열 넓다.
# - 재개 근거: #90의 비율 기각은 전부 GBDT 판정이고 TabM은 채택 5열만 물려받았다.
#   szymonkapiski 노트북(kernel 129458801)의 "트리 기각이 신경망 기각을 함의하지
#   않는다" 주장을 seed 42 TabM 짝비교로 직접 판정한다(대리 스크리닝 없음, #265).
# - 추가 11열 = 미판정 7열(over_9h, under_3h 포화 앵커, screen_over_sleep,
#   screen_minus_sleep, gaming_over_daily, weekend_minus_daily, screen_mean_dw)
#   + GBDT 스크리닝 기각 4열(wk_ratio, awake_screen_frac, notif_per_open,
#   min_per_open, #90 기각 재개봉) + 조성 입력 확보용 없음(전부 기존 cols 안).
#   식 이식과 라이선스 기록은 features.py의 XGB_IMPUTE_COMPOSITIONS 주석에 있다.
# - 판정: seed 42 짝비교 비음수 개선 관문 → 통과 시에만 3시드 확장, 완화된 ADR 0001
#   문턱(+0.00002)으로 exp065 교체(병존 아님, 스피어만 중복 게이트 근거).
# Vast.ai GPU 실행 대상(docs/agents/vast-resource-control.md).
name: exp130_tabm_continuous

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
          wk_ratio,
          awake_screen_frac,
          notif_per_open,
          min_per_open,
          over_9h,
          under_3h,
          screen_over_sleep,
          screen_minus_sleep,
          gaming_over_daily,
          weekend_minus_daily,
          screen_mean_dw,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabm
  params:
    arch_type: tabm-mini-normal
    tabm_k: 16
    num_emb_type: pwl
    d_embedding: 16
    batch_size: 128
    lr: 5.0e-4
    n_epochs: 150
    dropout: 0.02
    d_block: 160
    n_blocks: 10
    weight_decay: 1.0e-2
    patience: 5
    n_seed_avg: 3
    perm_repeats: 2
    perm_sample: 50000
  fit: {}
