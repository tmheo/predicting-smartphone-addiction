# 이슈 #413: configs/exp135_xgb_hpo_trial30.yaml의 관측 학습 길이 15개 중앙값 8295 중
# 약 40%인 3318회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #288: exp045 피처 계획을 고정하고 XGBoost 설정값 50회를 탐색한 차순위 후보다.
# Optuna 시행 번호 30의 fold 0 AUC는 0.9675804655607616이다.
# 최근접 풀 구성원은 exp045_xgb_depth8이고 스피어만 상관은 0.9977411679622838이다.
name: exp160_issue413_xgb_hpo_fixed40

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    eval_metric: auc
    n_estimators: 3318
    learning_rate: 0.012308318684441018
    max_depth: 6
    min_child_weight: 0.01709119838798812
    subsample: 0.8867482003747162
    colsample_bylevel: 0.9893695397039823
    colsample_bynode: 0.6169055082511526
    reg_alpha: 0.0016352782921359576
    reg_lambda: 2.329581725786453
    grow_policy: depthwise
    max_cat_to_onehot: 31
    max_leaves: 45
  fit: {}
