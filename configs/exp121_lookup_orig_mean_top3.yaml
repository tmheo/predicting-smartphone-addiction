# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #185: 원본 prior 상위 3열을 champion exp081 위에 이식하는 계열 1 스크리닝.
# exp081의 피처 계획과 모델 설정을 유지하고, exp032에서 검증된 원본 프록시 기준
# notifications·app_opens·work_study 3열의 m=20 평활 평균만 추가한다.
# 프록시 표만 쓰고 합성 train 라벨은 쓰지 않는다(row-wise, uses_target=False).

name: exp121_lookup_orig_mean_top3

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]
    - kind: original_prior
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols: [notifications_per_day, app_opens_per_day, work_study_hours]
      stats: [mean]
      smoothing: 20
      unknown: nan
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions: [social_frac, work_frac, leisure_frac, resid_frac, week_total]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lookup_transformer
  params:
    lookup_cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
    fold_seed_offsets: [0, 1000, 2000]
  fit: {}
