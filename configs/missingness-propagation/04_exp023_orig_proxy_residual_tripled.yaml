name: mpv1_exp023_orig_proxy_residual_tripled
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: derived
    names:
    - other_screen
    - screen_slack
  - kind: target_encoding
    inner_folds: 10
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - placebo_noise
model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
initial_score:
  kind: original_proxy_lightgbm
  params:
    path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - gender
    - stress_level
    - academic_work_impact
    categorical:
    - gender
    - stress_level
    - academic_work_impact
    model_params:
      objective: binary
      metric: auc
      learning_rate: 0.03
      num_leaves: 31
      n_estimators: 5000
      force_row_wise: true
      verbosity: -1
    n_splits: 5
    early_stopping_rounds: 100
    clip: 1.0e-06
training_rows:
  arm: tripled
  replica_count: 2
  observed_cell_mask_probability: 0.0
