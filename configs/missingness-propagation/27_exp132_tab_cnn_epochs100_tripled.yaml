name: mpv1_exp132_tab_cnn_epochs100_tripled
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: derived
    names:
    - screen_slack
    - sgw_sum
    - slack_frac
    - wk_minus_sgw
    - wk_other
    - sgw_frac
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: xgb_impute_aux
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    emit:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - weekend_screen_time
    compositions:
    - social_frac
    - work_frac
    - leisure_frac
    - resid_frac
    - week_total
    cat_cols:
    - gender
    - stress_level
    - academic_work_impact
model:
  kind: tab_cnn
  params:
    interaction_mode: convolution
    plr_bins: 12
    periodic_dim: 12
    periodic_sigma: 2.33
    dropout: 0.08
    head_samples: 5
    head_dropout: 0.2
    epochs: 100
    patience: 15
    batch_size: 128
    eval_batch_size: 8192
    lr: 0.002
    weight_decay: 0.015
    label_smoothing: 0.01
    scheduler_t0: 15
    n_quantiles: 1000
    perm_sample: 8192
    perm_repeats: 1
    device: cuda
  fit: {}
training_rows:
  arm: tripled
  replica_count: 2
  observed_cell_mask_probability: 0.0
paired_training_length:
  source: artifacts/issue510-paired-training-lengths.json
  sha256: 9c94657cb59ceef78a95b2e5254a03bed4849198a1f0848241ce807dbd46e613
  member: exp132_tab_cnn_epochs100
