name: mpv1_exp134_realmlp_muon_tripled
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers: []
model:
  kind: realmlp
  params:
    optimizer: muon
    n_ens: 8
    embed_dim: 8
    onehot_thresh: 8
    hidden_dims:
    - 512
    - 512
    - 512
    dropout: 0.06
    p_drop_sched: expm4t
    pbld_hidden_dim: 20
    pbld_out_dim: 5
    pbld_freq_scale: 5.0
    pbld_lr_factor: 0.093
    lr: 0.01
    mom: 0.9
    sq_mom: 0.98
    lr_sched: flat_cos
    flat_ratio: 0.3
    first_layer_lr_factor: 1.0
    first_layer_wd_factor: 0.1
    lr_scale_mult: 10.0
    lr_bias_mult: 0.1
    weight_decay: 0.013
    wd_scale_mult: 0.1
    wd_bias_mult: 0.5
    ema_decay: 0.997875
    grad_clip: 1.2
    ls_eps: 0.04
    ls_eps_sched: cos
    tfms:
    - median_center
    - robust_scale
    fixed_epochs: 4
    schedule_epochs: 8
    batch_size: 256
    eval_batch_size: 10240
    n_init_avg: 2
    init_seed_stride: 1000
    inner_folds: 5
    perm_sample: 8192
    perm_repeats: 1
    device: cuda
    verbosity: 1
  fit: {}
training_rows:
  arm: tripled
  replica_count: 2
  observed_cell_mask_probability: 0.0
paired_training_length:
  source: artifacts/issue510-paired-training-lengths.json
  sha256: 9c94657cb59ceef78a95b2e5254a03bed4849198a1f0848241ce807dbd46e613
