name: mpv1_exp133_scalar_token_transformer_oof_te_missingness_augmented
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: derived
    names:
    - screen_slack
    - sgw_sum
    - slack_frac
    - wk_minus_sgw
    - wk_other
    - sgw_frac
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: xgb_impute_aux
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    emit:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - weekend_screen_time
    compositions:
    - social_frac
    - work_frac
    - leisure_frac
    - resid_frac
    - week_total
    cat_cols:
    - gender
    - stress_level
    - academic_work_impact
  - kind: target_encoding
    inner_folds: 10
    smoothing: 10.0
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - gender
    - stress_level
    - academic_work_impact
    - placebo_noise
model:
  kind: scalar_token_transformer
  params:
    mixing: attention
    perm_repeats: 1
  fit: {}
training_rows:
  arm: missingness_augmented
  replica_count: 2
  observed_cell_mask_probability: 0.25
paired_training_length:
  source: artifacts/issue510-paired-training-lengths.json
  sha256: 9c94657cb59ceef78a95b2e5254a03bed4849198a1f0848241ce807dbd46e613
  member: exp133_scalar_token_transformer_oof_te
