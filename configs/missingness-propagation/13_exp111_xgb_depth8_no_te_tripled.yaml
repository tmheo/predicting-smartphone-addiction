name: mpv1_exp111_xgb_depth8_no_te_tripled
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: derived
    names:
    - other_screen
    - screen_slack
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: depthwise
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
  fit:
    early_stopping_rounds: 200
training_rows:
  arm: tripled
  replica_count: 2
  observed_cell_mask_probability: 0.0
paired_training_length:
