# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.

name: exp001_lgbm_baseline

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  # fold 분할은 파이프라인이 만들지 않는다. scripts/make_folds.py로 한 번 생성해 커밋한 파일을 읽기 전용으로 쓴다. (#15)
  folds: artifacts/folds.parquet

features:
  # "raw"는 id와 타깃을 제외한 원시 컬럼 전부. (#16: baseline은 원시 피처만)
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  # 개선 판정용 플라시보(무작위 잡음) 피처는 항상 포함한다. (#15)
  placebo: true

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  # 모델 시드 반복. 기본 1회, 미세 판정 때만 [42, 43, 44] 같은 3시드 평균. (#15)
  seeds: [42]
