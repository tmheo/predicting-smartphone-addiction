# 이슈 #122: exp074에서 실제 행 표본추출만 끄는 seed 42 대조.
# subsample 값은 유지하되 subsample_freq=0으로 설정해 LightGBM 행 표본추출을 비활성화한다.
# exp074보다 약하면 행 표본추출의 기여를 확인하고 3시드 재검증으로 확장하지 않는다.

name: exp075_lgb_kitopl_d2_no_rowsampling

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.03172214617330919
    num_leaves: 45
    min_child_samples: 229
    n_estimators: 10000
    max_bin: 1023
    colsample_bytree: 0.4654152088234655
    subsample: 0.9225106784455195
    subsample_freq: 0
    reg_lambda: 0.9179636700368584
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
