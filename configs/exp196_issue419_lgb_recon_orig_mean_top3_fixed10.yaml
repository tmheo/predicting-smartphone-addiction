# 이슈 #419: configs/exp032_recon_orig_mean_top3.yaml의 관측 학습 길이 15개 중앙값 369 중
# 약 10%인 37회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #78: 기준선 개정(#74)으로 통과 반전된 exp021(원본 prior 상위 3열 제거 실험)의 재구성.
# exp026 베이스(recon 4열 포함) 위에 같은 델타(옛 스크리닝에서 gain importance가 플라시보를
# 넘은 notifications·app_opens·work_study 3열의 m=20 평활 평균)를 얹어 다시 잰다.
# 프록시 표만 쓰고 합성 train 라벨은 쓰지 않는다(row-wise, uses_target=False).
# seed 42 스크리닝(run 4a90cf42)은 +0.00008 통과, 새 피처 3개 전부 플라시보 상회.
# 재구성 6종 중 유일하게 새 피처 게이트까지 통과해 3시드 확정 재검증으로 전환.
# 3시드 확정(클린 run b1bd4b08)은 +0.0000996으로 문턱 +0.0001에 4e-7 미달, champion 교체 기각.
# 3/3 시드, 5/5 fold 개선과 새 피처 게이트 전부 통과였으나 계약(ADR 0001)대로 기각.
# 다양성 구성원으로는 진입(스피어만 0.99790, 표준 평가 앙상블 기여 +0.00009), 풀 등록.

name: exp196_issue419_lgb_recon_orig_mean_top3_fixed10

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_prior
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols: [notifications_per_day, app_opens_per_day, work_study_hours]
      stats: [mean]
      smoothing: 20
      unknown: nan
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 37
    force_row_wise: true
  fit: {}
