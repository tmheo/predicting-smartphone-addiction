# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #75: 숫자 열 전체 36쌍 격자 TE 블록의 기여 재검토. #51의 개별 선별 쌍 TE와 달리
# 정수 내림 셀 키로 전 쌍을 일괄 추가하고 각 TE 열 옆에 셀 개수 열을 병행한다
# (szymonkapiski full lattice, docs/research/code-notebook-insights-2.md).
# 평활 m=20과 내부 4-fold는 출처 구성을 따른다. placebo 쌍 카나리아는 자동 포함.
# exp026 champion 베이스에 lattice_pair_te 블록(37쌍 x TE·CT = 74열)만 더한다.
# 0.1 해상도 셀 추가 변형은 exp034로 분리해 따로 잰다.
# seed 42 스크리닝(run e02d3e5c)은 -0.00037 미달로 champion 교체 기각. 화면·알림 쌍 TE
# 일부는 gain이 매우 컸으나(중요도는 단일 TE에서 나눠 갖고 예측력은 추가 안 됨, #49 패턴)
# CT 열 36개 전부 플라시보 미달. 카나리아 3종 통과로 측정 자체는 유효.
# 이후 3시드 전환은 다양성 구성원 진입 판정(#77이 잰 양자화 계열 결손) 전용이다.
# 번호 이력: 스크리닝은 exp033_lattice_te 이름으로 실행됐으나(#80이 같은 시각 exp033
# 번호를 선점) exp035로 재번호. run e02d3e5c(스크리닝)와 5fdb7c26(구번호 3시드)이 옛 이름이다.

name: exp035_lattice_te

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: lattice_pair_te
      resolutions: [floor]
      inner_folds: 4
      smoothing: 20
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
