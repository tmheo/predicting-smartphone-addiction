# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #520: exp111_xgb_depth8_no_te의 자료, 피처 계획, XGBoost 설정과 fit 설정을
# 그대로 두고 정확값 one-hot L2 로지스틱 회귀의 내부 OOF 로짓 초기 점수만 더한다.
# 초기 점수 입력은 raw 12열이며 constrained_impute_aux 출력과 플라시보 잡음 열은
# 포함하지 않는다.
# 로지스틱 좌표는 C=100, L2, lbfgs, max_iter=3000, onehot_max_card=5000,
# inner_splits=10, clip=1e-6으로 결과 확인 전에 고정했다.

name: exp211_issue520_xgb_lr_onehot_init

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: depthwise
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
  fit:
    early_stopping_rounds: 200

initial_score:
  kind: nested_logistic_onehot
  params:
    cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
    categorical: [gender, stress_level, academic_work_impact]
    C: 100.0
    max_iter: 3000
    onehot_max_card: 5000
    inner_splits: 10
    clip: 1.0e-6
