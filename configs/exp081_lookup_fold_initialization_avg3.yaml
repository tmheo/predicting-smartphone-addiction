# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #127: Lookup-Transformer fold 내 초기화 평균의 성능·다양성 기여 결정.
# 기준 exp067의 피처 계획과 학습 설정을 유지하고, 파이프라인 시드 s마다
# 초기화 시드 s, s+1000, s+2000인 모델 세 개의 확률 예측을 fold 안에서 평균한다.
# 이 초기화 평균은 확정 재검증의 바깥 시드 평균본 [42, 43, 44]와 구분한다.
# seed 42 스크리닝은 0.96908740으로 champion의 같은 시드보다 +0.00032484였다.
# 3시드 확정 재검증(run d55d1cd4)은 평균 0.96919576, +0.00009792와 시드 3/3,
# fold 5/5 개선이었다. champion 교체 문턱에는 0.00000208 미달해 교체하지 않았다.
# 최근접 exp059와 스피어만 0.99142, 표준 평가 앙상블 기여 +0.00016654로 후보 풀에 등록했다.
name: exp081_lookup_fold_initialization_avg3

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions: [social_frac, work_frac, leisure_frac, resid_frac, week_total]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lookup_transformer
  params:
    lookup_cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
    fold_seed_offsets: [0, 1000, 2000]
  fit: {}
