# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #87: 원본 프록시의 1차원 가우시안 KDE 로그밀도비 3열(kodaifukuda 레시피, #84 검증)의
# 한계 기여 판정. champion exp043_cat_depth6 구성 위에 original_kde_ratio만 더한다.
# 정확값 일치(#53)가 아니라 주변 원본 밀도를 클래스별로 평활화해 비교하고,
# 다변량 이웃 거리(#54)와 달리 열마다 별도의 1차원 밀도를 쓴다.
# 프록시 표만 쓰고 합성 train 라벨은 쓰지 않는다(row-wise, uses_target=False).
name: exp047_orig_kde_lr

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_kde_ratio
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols: [weekend_screen_time, notifications_per_day, app_opens_per_day]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
