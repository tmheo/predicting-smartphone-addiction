# 이슈 #387: 이슈 #289 CatBoost GPU 탐색의 미승격 시행 6번을 CPU 3시드 평균본으로 생산한다.
# fold 0 AUC 0.967711697706664, 최근접 풀 스피어만 0.994841163202092.
name: exp152_issue387_cat_trial6
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: categorical_copies
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: derived
    names:
    - other_screen
    - screen_slack
  - kind: target_encoding
    inner_folds: 10
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - placebo_noise
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: xgb_impute_aux
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    emit:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - weekend_screen_time
    compositions:
    - social_frac
    - work_frac
    - leisure_frac
    - resid_frac
    - week_total
    cat_cols:
    - gender
    - stress_level
    - academic_work_impact
model:
  kind: catboost
  params:
    iterations: 10000
    eval_metric: AUC
    max_ctr_complexity: 1
    boosting_type: Plain
    max_bin: 254
    bootstrap_type: Bernoulli
    learning_rate: 0.019809338952032924
    subsample: 0.976562270506935
    grow_policy: Depthwise
    depth: 4
    l2_leaf_reg: 0.003378449765619961
    leaf_estimation_iterations: 2
    one_hot_max_size: 15
    model_size_reg: 0.9433458442225104
    thread_count: 4
  fit:
    early_stopping_rounds: 200
