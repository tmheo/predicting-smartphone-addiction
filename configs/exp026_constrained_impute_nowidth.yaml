# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #74: 제약 결측 재구성(exp025)의 recon 전용 변형. 폭 열 3개(*_recon_width)는
# exp025 seed 42 스크리닝에서 gain importance가 플라시보 미달이라 확정 재검증의
# 새 피처 게이트를 통과할 수 없으므로 뺀다. 화면 블록 4열의 _recon 병행 열만 추가한다.
# 짝지은 스크리닝 기준선(ADR 0001 #74 개정)에서 exp025는 +0.00016 통과였고,
# 이 변형은 그 개선을 게이트 통과 가능한 최소 구성으로 다시 재는 seed 42 스크리닝.

name: exp026_constrained_impute_nowidth

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
