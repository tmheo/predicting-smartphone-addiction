# 이슈 186: 풀 29의 최고 nested OOF 위에 교사-학생 순위 잔차 보정을 평가한다.
# 실행 진입점은 pipeline.run이 아니라 pipeline.teacher_student_residual이다.
# 교사는 원시 열, 정확값 빈도, 결측 표시와 생성 제약 표현을 쓰는 LightGBM이다.
# 학생은 같은 설명변수로 교사 OOF 순위를 재구성하되 잎과 최소 잎 자료 수를 제한한다.
name: exp137_teacher_student_rank_residual

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, sgw_sum, slack_frac, wk_other, notif_per_app]
    - kind: missing_indicators
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          gender,
          stress_level,
          academic_work_impact,
        ]
    - kind: frequency_encoding
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          gender,
          stress_level,
          academic_work_impact,
        ]

# 표준 설정 적재기와 피처 계획 검증을 그대로 통과하도록 교사 설정을 model에 둔다.
model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    max_bin: 1023
    n_estimators: 10000
    deterministic: true
    force_row_wise: true
    verbosity: -1
    n_jobs: -1
  fit:
    early_stopping_rounds: 200

teacher_student_residual:
  baseline:
    run_id: 33bde7e429d8407cb8b46b4737450265
    strategy: missing_segmented_rank_logit
    pool_members: 29
    auc_oof: 0.9696999775221133
    oof_sha256: 6a8b909ff4412779f1ab5ebff6ad218e19628f2eea19d744cf016e3809cff61b
  seed: 42
  refit_iteration_multiplier: 1.25
  student:
    params:
      objective: regression
      metric: l2
      learning_rate: 0.03
      num_leaves: 31
      min_data_in_leaf: 1000
      lambda_l2: 10.0
      max_bin: 255
      n_estimators: 4000
      deterministic: true
      force_row_wise: true
      verbosity: -1
      n_jobs: -1
    fit:
      early_stopping_rounds: 100
  correction:
    weight: 0.10
    clip_to_reference_range: true
  judgment:
    minimum_auc_gain: 0.00002
    minimum_fold_wins: 3
