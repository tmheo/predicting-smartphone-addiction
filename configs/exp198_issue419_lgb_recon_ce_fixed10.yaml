# 이슈 #419: configs/exp027_recon_ce.yaml의 관측 학습 길이 15개 중앙값 379 중
# 약 10%인 38회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #78: 기준선 개정(#74)으로 통과 반전된 exp012(빈도 인코딩 CE)의 재구성.
# 옛 champion exp011 베이스의 기록은 champion 교체(exp026)로 동일 조건 비교가 깨져,
# exp026 베이스(recon 4열 포함) 위에 같은 델타(TE와 같은 8개 컬럼의 CE)를 얹어 다시 잰다.
# CE는 타깃을 쓰지 않아 placebo 카나리아 대상이 아니고, 새 피처 게이트(플라시보 대비)만 받는다.
# seed 42 스크리닝 단계.

name: exp198_issue419_lgb_recon_ce_fixed10

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: frequency_encoding
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 38
    force_row_wise: true
  fit: {}
