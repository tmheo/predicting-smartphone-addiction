# 이슈 #109: 값 종류가 많은 원시 화면 시간 두 열만 max_bin 1439로 높이는 seed 42 대조.
# exp063과 같은 피처 계획과 모델 파라미터에서 열별 구간 해상도만 바꾼다.

name: exp072_lgb_raw_screen_bins_1439

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    max_bin: 1023
    max_bin_by_feature:
      daily_screen_time_hours: 1439
      weekend_screen_time: 1439
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
