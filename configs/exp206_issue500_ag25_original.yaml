# 이슈 #500: exp117_ag25_gbm_r21을 그대로 실행하는 일반 기준군.
name: exp206_issue500_ag25_original

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

training_rows:
  arm: original
  replica_count: 0
  observed_cell_mask_probability: 0.0

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    n_estimators: 20000
    bagging_fraction: 0.7218730663234
    bagging_freq: 1
    cat_l2: 0.0296205152578
    cat_smooth: 0.0010255271303
    extra_trees: false
    feature_fraction: 0.4557131604374
    lambda_l1: 0.5219704038237
    lambda_l2: 0.1070959487853
    learning_rate: 0.0055891584996
    max_cat_to_onehot: 71
    min_data_in_leaf: 50
    min_data_per_group: 10
    num_leaves: 30
  fit:
    early_stopping_rounds: 200
