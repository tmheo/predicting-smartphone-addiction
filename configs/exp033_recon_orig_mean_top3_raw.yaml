# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #80: exp032(원본 prior 상위 3열, m=20)가 확정에서 +0.0000996으로 문턱 4e-7 미달 기각된 뒤,
# 같은 라운드에서 평활 제거(m=0)가 9열 구성(exp030 +0.00012 > exp029 +0.00007)으로 더 높았던 관찰을 따라
# exp032 설정에서 smoothing만 0으로 바꾼 변형. 상위 3열(notifications·app_opens·work_study)은 그대로다.
# 프록시 표만 쓰고 합성 train 라벨은 쓰지 않는다(row-wise, uses_target=False).
# seed 42 스크리닝(run 4620620e)은 +0.00006 통과. 단 work_study_hours_orig_mean의
# gain importance(26736)가 플라시보(27261)를 소폭 밑돌아 확정 게이트 미달 위험 경고.
# 계약대로 3시드 확정 재검증 단계로 전환.

name: exp033_recon_orig_mean_top3_raw

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_prior
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols: [notifications_per_day, app_opens_per_day, work_study_hours]
      stats: [mean]
      smoothing: 0
      unknown: nan
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
