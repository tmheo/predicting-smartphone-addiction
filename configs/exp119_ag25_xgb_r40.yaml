# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #197: AutoGluon zeroshot portfolio 2025의 XGB _r40 설정 이식.
# 출처: autogluon/autogluon(Apache-2.0) zeroshot_portfolio_2025.py,
# 커밋 2d7e6056b8b64dc44114faf652d4c99ec3c3770f. ag_args와 enable_categorical(adapter 소유)만
# 제거하고 파라미터는 원본 그대로. tree_method hist와 eval_metric auc는 저장소 규약.
# 피처 세트는 champion 계열(exp065_tabm과 동일)이라 학습기 설정 차이만 판정한다.
# 약식 검증(fold 0, seed 42): AUC 0.9678245(약식 전체 1위), base_xgb 대비 +0.00047로 승격
# (docs/research/zeroshot-portfolio-2025-screen.md). best_iteration 8252가 상한에 가까워
# 스크리닝은 n_estimators 20000으로 여유를 둔다.
name: exp119_ag25_xgb_r40


data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: xgboost
  params:
    tree_method: hist
    eval_metric: auc
    n_estimators: 20000
    colsample_bylevel: 0.6377491713202
    colsample_bynode: 0.9237625621103
    grow_policy: lossguide
    learning_rate: 0.0112462621131
    max_cat_to_onehot: 33
    max_depth: 10
    max_leaves: 35
    min_child_weight: 0.1403464856034
    reg_alpha: 3.4960653958503
    reg_lambda: 1.3062320805235
    subsample: 0.6948898835178
  fit:
    early_stopping_rounds: 200
