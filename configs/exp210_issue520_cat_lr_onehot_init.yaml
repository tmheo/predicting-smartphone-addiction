# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #520: exp071_cat_exact_no_te의 자료, 피처 계획, CatBoost 설정과 fit 설정을
# 그대로 두고 정확값 one-hot L2 로지스틱 회귀의 내부 OOF 로짓 초기 점수만 더한다.
# 초기 점수 입력은 raw 12열이며 categorical_copies, constrained_impute_aux와
# xgb_impute_aux 출력 및 플라시보 잡음 열은 포함하지 않는다.
# 로지스틱 좌표는 C=100, L2, lbfgs, max_iter=3000, onehot_max_card=5000,
# inner_splits=10, clip=1e-6으로 결과 확인 전에 고정했다.

name: exp210_issue520_cat_lr_onehot_init

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: categorical_copies
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
    max_ctr_complexity: 1
  fit:
    early_stopping_rounds: 200

initial_score:
  kind: nested_logistic_onehot
  params:
    cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
    categorical: [gender, stress_level, academic_work_impact]
    C: 100.0
    max_iter: 3000
    onehot_max_card: 5000
    inner_splits: 10
    clip: 1.0e-6
