# 이슈 #621 초안: 제약 파생 4열 승격 사다리(cdv1). 기준 설정은 exp070_cat_exact_cats이며 기준의 제공자와 모형 설정은 바꾸지 않는다.
# 1단계: 제약 파생 4열을 원시 열과 같은 지위의 수치 입력으로 더한다.
# 명세: docs/research/constraint-derived-ladder-spec.md. 구현 전(#622)이라 아직 설정 파싱을 통과하지 않는다.
name: cdv1_cat_raw4
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: categorical_copies
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: derived
    names:
    - other_screen
    - screen_slack
    - fake_daily
    - fake_social
    - fake_work
    - fake_game
  - kind: target_encoding
    inner_folds: 10
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - placebo_noise
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  - kind: xgb_impute_aux
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    emit:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - weekend_screen_time
    compositions:
    - social_frac
    - work_frac
    - leisure_frac
    - resid_frac
    - week_total
    cat_cols:
    - gender
    - stress_level
    - academic_work_impact
model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
    max_ctr_complexity: 1
  fit:
    early_stopping_rounds: 200
