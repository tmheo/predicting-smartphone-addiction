# 이슈 #621 명세: 제약 파생 4열 승격 사다리(cdv2). 기준 설정은 exp135_xgb_hpo_trial30이며 기준의 제공자와 모형 설정은 바꾸지 않는다.
# 2단계: 1단계 위에 4열의 정확값 TE를 더한다. #634 결정으로 LightGBM·XGBoost는 범주 복제 4열을 두지 않는다(cdv2).
# 명세: docs/research/constraint-derived-ladder-spec.md. 파생 4열과 범주 복제·RealMLP 인자는 #622가 구현했다.
name: cdv2_xgb_cats_te
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: derived
    names:
    - other_screen
    - screen_slack
    - fake_daily
    - fake_social
    - fake_work
    - fake_game
  - kind: target_encoding
    inner_folds: 10
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    - fake_daily
    - fake_social
    - fake_work
    - fake_game
    - placebo_noise
  - kind: constrained_impute_aux
    widths: false
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
model:
  kind: xgboost
  params:
    tree_method: hist
    eval_metric: auc
    n_estimators: 10000
    learning_rate: 0.012308318684441018
    max_depth: 6
    min_child_weight: 0.01709119838798812
    subsample: 0.8867482003747162
    colsample_bylevel: 0.9893695397039823
    colsample_bynode: 0.6169055082511526
    reg_alpha: 0.0016352782921359576
    reg_lambda: 2.329581725786453
    grow_policy: depthwise
    max_cat_to_onehot: 31
    max_leaves: 45
  fit:
    early_stopping_rounds: 200
