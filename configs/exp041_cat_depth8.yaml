# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #59: 트리 모델 계열 다양화 2탄 CatBoost. champion exp026과 동일한 피처 세트에서
# 학습기만 바꾼다(#77 진단의 우선 순위 2). 대칭 트리 depth 8 = 256 leaves로
# champion(num_leaves 255)의 용량을 비추고 lr 0.05. 범주형은 native cat_features로
# 학습하며 결측 sentinel 문자열 변환은 adapter 소유다.

name: exp041_cat_depth8

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 8
    learning_rate: 0.05
    eval_metric: AUC
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
