# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #74: 생성 규칙 daily >= social + gaming + work를 산술 경계로 쓰는 제약 결측 재구성.
# 학습 fold로 fit한 IterativeImputer 추정치를 실현 가능 구간으로 잘라 화면 블록 4열의
# _recon 병행 열을 만들고, 성분 3열에는 구간 폭(_recon_width)을 병행한다.
# 이슈 #49가 기각한 것은 무제약 중앙값 대체 보조 열이고, 이 변형(제약 클리핑 + 폭 열)은
# szymonkapiski 측정 +0.00041(이득이 결측 층에 집중)에 근거한 미검증 항목이다.
# champion exp011_resid_pair 구성 위에 얹은 실험.
# seed 42 스크리닝(run c62dbb02)은 짝지은 기준선(ADR 0001 #74 개정) +0.00016 통과이고
# 이득이 결측 있는 층에 집중돼 기제가 작동한다. 다만 폭 열 3개(*_recon_width)는 gain
# importance 플라시보 미달이라 확정 재검증의 새 피처 게이트를 통과할 수 없어, champion
# 교체 트랙은 폭 열을 뺀 exp026_constrained_impute_nowidth가 잇는다. 이 실험은 다양성
# 세 게이트 통과(최근접 스피어만 0.99580, 표준 평가 앙상블 기여 +0.00011)에 따른
# 후보 풀 진입 확정용 3시드 평균본 단계다.

name: exp025_constrained_impute

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
