# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #59: 트리 모델 계열 다양화 1탄 XGBoost. champion exp026과 동일한 피처 세트에서
# 학습기만 바꾼다. #77 진단에서 라이브러리 XGBoost 계열이 같은 특성의 CatBoost·LightGBM보다
# 높은 blend 한계 기여(+0.0005~0.0007)를 보여 우선 순위 1이다.
# 용량은 champion(num_leaves 255)을 그대로 비추는 lossguide 255 leaves, lr 0.05.
# 범주형은 category dtype native 학습(enable_categorical은 adapter 소유).

name: exp040_xgb_lossguide

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: lossguide
    max_leaves: 255
    max_depth: 0
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
