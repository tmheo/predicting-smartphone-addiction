# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #197: AutoGluon zeroshot portfolio 2025의 GBM _r33 설정 이식(포트폴리오 1순위 GBM).
# 출처: autogluon/autogluon(Apache-2.0) zeroshot_portfolio_2025.py,
# 커밋 2d7e6056b8b64dc44114faf652d4c99ec3c3770f. ag_args만 제거하고 파라미터는 원본 그대로.
# 피처 세트는 champion 계열(exp065_tabm과 동일)이라 학습기 설정 차이만 판정한다.
# 약식 검증(fold 0, seed 42): AUC 0.9677621, base_lgb 대비 +0.00089로 승격
# (docs/research/zeroshot-portfolio-2025-screen.md).
name: exp118_ag25_gbm_r33


data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    n_estimators: 10000
    bagging_fraction: 0.9625293420216
    bagging_freq: 1
    cat_l2: 0.1236875455555
    cat_smooth: 68.8584757332856
    extra_trees: false
    feature_fraction: 0.6189215809382
    lambda_l1: 0.1641757352921
    lambda_l2: 0.6937755557881
    learning_rate: 0.0154031028561
    max_cat_to_onehot: 17
    min_data_in_leaf: 1
    min_data_per_group: 30
    num_leaves: 68
  fit:
    early_stopping_rounds: 200
