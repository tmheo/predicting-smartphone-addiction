# 이슈 #428: exp134_realmlp_muon의 8회 학습률 일정에서 1·2·3회 EMA 상태를 한 궤적으로 만든다.
name: exp204_issue428_realmlp_muon_epoch2

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers: []

model:
  kind: realmlp
  params:
    optimizer: muon
    n_ens: 8
    embed_dim: 8
    onehot_thresh: 8
    hidden_dims: [512, 512, 512]
    dropout: 0.06
    p_drop_sched: expm4t
    pbld_hidden_dim: 20
    pbld_out_dim: 5
    pbld_freq_scale: 5.0
    pbld_lr_factor: 0.093
    lr: 0.01
    mom: 0.9
    sq_mom: 0.98
    lr_sched: flat_cos
    flat_ratio: 0.3
    first_layer_lr_factor: 1.0
    first_layer_wd_factor: 0.1
    lr_scale_mult: 10.0
    lr_bias_mult: 0.1
    weight_decay: 0.013
    wd_scale_mult: 0.1
    wd_bias_mult: 0.5
    ema_decay: 0.997875
    grad_clip: 1.2
    ls_eps: 0.04
    ls_eps_sched: cos
    tfms: [median_center, robust_scale]
    fixed_epochs: 4
    schedule_epochs: 8
    batch_size: 256
    eval_batch_size: 10240
    n_init_avg: 2
    init_seed_stride: 1000
    inner_folds: 5
    perm_sample: 8192
    perm_repeats: 1
    device: cuda
    verbosity: 1
  fit: {}

training_state:
  trajectory: issue428_realmlp_muon_1_2_3_horizon8
  candidates: [1, 2, 3]
  selected: 2
  schedule_horizon_epochs: 8
  trajectory_end_epochs: 4
  state_kind: ema
  selection_rule: precommitted
