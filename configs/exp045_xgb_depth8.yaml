# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #59: exp040_xgb_lossguide(+0.00008 스크리닝 통과)의 성장 정책 변형. depthwise
# max_depth 8이 lossguide 255 leaves보다 나은지 작은 범위 용량 비교로 확인한다.
# 피처 세트는 champion exp026과 동일.
# seed 42 스크리닝(run 33b3b37f)은 +0.00038로 계열 내 최고. exp043 진입 가정의 풀에서
# 한계 기여 +0.00005, exp043과 스피어만 0.99070. 다양성 구성원 후보로 3시드 전환한다.
name: exp045_xgb_depth8

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    grow_policy: depthwise
    max_depth: 8
    learning_rate: 0.05
    n_estimators: 10000
    eval_metric: auc
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
