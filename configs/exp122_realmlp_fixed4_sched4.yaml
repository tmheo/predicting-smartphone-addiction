# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #232: exp121에서 schedule_epochs만 8에서 4로 바꾼 단일 델타 짝비교.
# 어닐링을 4 epoch 안에 완주해 학습률과 label smoothing 스케줄이 끝값에 도달한다.
# 기준선: configs/exp121_realmlp_fixed4_two_init.yaml
# (확인 실행 56701722ba224b98b5ddf799ec5e55db, 3시드 평균 OOF 0.9637131967).
# 원문 출처와 라이선스 기록은 exp121 설정과 realmlp.py 주석을 그대로 따른다.
name: exp122_realmlp_fixed4_sched4

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers: []

model:
  kind: realmlp
  params:
    n_ens: 8
    embed_dim: 8
    onehot_thresh: 8
    hidden_dims: [512, 512, 512]
    dropout: 0.06
    p_drop_sched: expm4t
    pbld_hidden_dim: 20
    pbld_out_dim: 5
    pbld_freq_scale: 5.0
    pbld_lr_factor: 0.093
    lr: 0.01
    mom: 0.9
    sq_mom: 0.98
    lr_sched: flat_cos
    flat_ratio: 0.3
    first_layer_lr_factor: 1.0
    first_layer_wd_factor: 0.1
    lr_scale_mult: 10.0
    lr_bias_mult: 0.1
    weight_decay: 0.013
    wd_scale_mult: 0.1
    wd_bias_mult: 0.5
    ema_decay: 0.997875
    grad_clip: 1.2
    ls_eps: 0.04
    ls_eps_sched: cos
    tfms: [median_center, robust_scale]
    fixed_epochs: 4
    schedule_epochs: 4
    batch_size: 256
    eval_batch_size: 10240
    n_init_avg: 2
    init_seed_stride: 1000
    inner_folds: 5
    perm_sample: 8192
    perm_repeats: 1
    device: cuda
    verbosity: 1
  fit: {}
