# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #79: 플라시보 미달 피처 제거 변형 (c). 변형 (b)에 더해 champion(exp026)에서
# 경계선 미달(플라시보의 0.97배)이던 work_study_hours_te를 TE 목록에서 뺀다.
# raw work_study_hours는 통과(1.63배)이므로 유지한다.
# 그 외는 champion exp026과 동일. 피처 제거 실험이라 새 피처 게이트는 해당 없음.
# seed 42 스크리닝(run ad7dcf7b)은 -0.00003으로 미달 기각. 경계선(0.97배)이던
# work_study_hours_te도 빼면 성능이 깎여, 잉여가 아니라 실신호를 나눠 갖는 열이다.

name: exp039_drop_floor_wste

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  exclude: [gender, stress_level, academic_work_impact, age]
  categorical: []
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
