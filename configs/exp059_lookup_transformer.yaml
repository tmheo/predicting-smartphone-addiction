# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #58: Lookup-Transformer의 다양성 기여 결정(기본 구성).
# 원문(tamerlanomralinov, LB 0.97041)의 정확값 lookup embedding + PLR 수치
# embedding + Transformer를 커밋된 5-fold로 재현한다. 원문의 10/11-fold 혼재와
# train+test 전체 어휘 구성은 5-fold·학습 fold 전용 어휘로 해소한다(티켓 규율).
# 파생 6열은 원문의 예산 토큰 재현이며 PLR 전용 토큰이 된다(원문 DERIV와 같은 식:
# other_screen->screen_slack, other_frac->slack_frac 이름만 우리 규약).
# 하이퍼파라미터는 원문 그대로(d128/k24/4층/8헤드, 32ep, bs2048, lr 2e-3, EMA).
# Kaggle GPU 실행 대상(docs/kaggle-gpu-run.md).
name: exp059_lookup_transformer

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]

model:
  kind: lookup_transformer
  params:
    lookup_cols:
      [
        age,
        gender,
        daily_screen_time_hours,
        social_media_hours,
        gaming_hours,
        work_study_hours,
        sleep_hours,
        notifications_per_day,
        app_opens_per_day,
        weekend_screen_time,
        stress_level,
        academic_work_impact,
      ]
  fit: {}
