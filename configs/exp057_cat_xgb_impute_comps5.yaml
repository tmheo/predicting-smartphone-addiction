# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #90: 복원 행렬 조성 피처 5열의 CatBoost 공식 스크리닝.
# LightGBM 대리 exp056(run 32d5cacc)이 +0.00019에 새 5열 전부 플라시보 상회로
# 통과해 공식 판정을 연다. 피처 세트는 champion exp052 구성에 조성 5열
# (social_frac, work_frac, leisure_frac, resid_frac, week_total)만 더한 것이다.
# seed 42 스크리닝(run dd1369ef)은 +0.00016 통과, 새 피처 5개 전부 플라시보 상회.
# 대리(+0.00019)와 방향·규모가 일치해 3시드 확정 재검증으로 전환한다.
name: exp057_cat_xgb_impute_comps5

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
