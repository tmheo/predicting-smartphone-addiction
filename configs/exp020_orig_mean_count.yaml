# 이슈 #53: 원본 프록시(jayjoshi37 판본 1, 해시는 코드가 검증)의 값별 라벨 평균 prior.
# exp018에 프록시 값 빈도 log1p(count)를 추가한 변형: 평균이 못 담는 원본 지지도 정보.
# 프록시 표만 쓰고 합성 train 라벨은 쓰지 않는다(row-wise, uses_target=False).
# 스크리닝(seed 42) 단계.

name: exp020_orig_mean_count

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_prior
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      stats: [mean, count]
      smoothing: 20
      unknown: nan
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
