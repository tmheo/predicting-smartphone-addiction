# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #49 변형 3b: 반올림 표현. 소수 격자 6개 컬럼을 소수 1자리로 반올림한 키의 타깃 인코딩을
# 정확값 TE와 병행한다(해상도를 낮춘 정확값 키, 코드 노트북 3번 계열). placebo 카나리아 포함.
# champion exp011_resid_pair 위 seed 42 스크리닝.

name: exp015_te_r1

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: target_encoding
      inner_folds: 10
      key_digits: 1
      suffix: _te_r1
      cols:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
