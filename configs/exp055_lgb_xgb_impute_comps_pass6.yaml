# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #90: 복원 행렬 조성 피처의 축소 재시도 대리 스크리닝. exp054(run ee3339dd)가
# OOF +0.00019에도 12열 중 6열 플라시보 미달로 블록 미달이라, #74·#86 전례대로
# 플라시보 상회 6열(social_frac, work_frac, leisure_frac, resid_frac, week_total,
# free_time)만 남긴다. 조성은 복원 행렬에서 행 단위로 계산하므로 부분집합의 값이
# 전체 구성과 같다(복원기 입력도 cols 전체로 동일). 기준 실행은 exp054와 같은
# exp051(run f139eeec4b2c495a9aeab56aba3ec665).
# 결과(run 6fa5d5ad): OOF +0.00018 통과였지만 free_time이 중요도 재분배로 플라시보
# 미달로 떨어져 블록 미달. 상회 5열만 남긴 exp056으로 줄인다.
name: exp055_lgb_xgb_impute_comps_pass6

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
          free_time,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
