# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #78: 기준선 개정(#74)으로 통과 반전된 exp014(소수 첫째 자리 표현)의 재구성.
# exp026 베이스(recon 4열 포함) 위에 같은 델타(소수 격자 6개 컬럼의 dec1 파생)를 얹어 다시 잰다.
# seed 42 스크리닝 단계.

name: exp028_recon_dec1

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names:
        [
          other_screen,
          screen_slack,
          daily_screen_time_hours_dec1,
          social_media_hours_dec1,
          gaming_hours_dec1,
          work_study_hours_dec1,
          sleep_hours_dec1,
          weekend_screen_time_dec1,
        ]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
