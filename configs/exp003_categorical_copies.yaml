# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #31 변형 (b): 수치 컬럼은 유지하고 <col>_cat 범주형 복제 컬럼을 추가.
# 수치의 순서 정보와 정확값 묶기 신호를 같이 쓸 수 있는지 본다.

name: exp003_categorical_copies

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  categorical_copies:
    [
      age,
      daily_screen_time_hours,
      social_media_hours,
      gaming_hours,
      work_study_hours,
      sleep_hours,
      notifications_per_day,
      app_opens_per_day,
      weekend_screen_time,
    ]
  placebo: true

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
