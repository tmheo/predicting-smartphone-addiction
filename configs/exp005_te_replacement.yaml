# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #36: 정확값 신호의 표현 맞대결. exp003의 <col>_cat 복제 9개를 빼고
# 그 자리에 정확값 타깃 인코딩 <col>_te 9개를 넣는 교체 변형.
# 원시 수치 9개와 범주형 3개는 유지(exp002에서 수치 제거는 -0.00417로 판정됨).
# placebo_noise_te는 누수 카나리아 전용으로, 개선 판정의 새 피처에서 제외된다.

name: exp005_te_replacement

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  fold_fit:
    - kind: target_encoding
      # 바깥쪽 학습 fold 안에서 내부 층화 10-fold OOF로 학습 행 인코딩. (#33)
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
