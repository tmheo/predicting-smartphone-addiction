# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #258: zhenruiweng 공개 RealMLP 0.97009 판(kernel 129907249, Apache-2.0,
# SHA-256 ef16bb88782581ad4e880f295903db88278428464c1aa31643a0511d5197b116)의
# 상호작용·비율·로그 파생 수치 16열을 RealMLP 본실험(exp124 위)에 넣기 전
# LightGBM 대리 스크리닝. #244 개봉 결정과 #234 결정 5(파생은 대리 먼저)를 따른다.
# 기준 실행은 exp117 seed 42(run 348ed829)이고, 이 설정은 exp117에 derived 16열만
# 더한 단일 델타 짝비교다. 모델 설정·나머지 피처 계획은 exp117과 동일하다.
# 이식이 원본과 달라지는 지점(중앙값 대체 없이 결측 자연 전파, 비율은 +1e-6 대신
# 마스크, 스트레스 missing→1 대신 NaN)은 features.py의 zhenrui 블록 주석에 있다.
# 판정: pipeline.compare <run> --proxy-baseline 348ed829 (문턱 개선 >= 0,
# 카나리아·새 피처 importance 게이트). 통과 시 #258에서 RealMLP 본실험을 열고,
# 미달 시 파생 16열 축을 닫고 이 설정을 기각 근거의 재현 기록으로 남긴다(exp106 전례).
# 참고: 16열 중 4열(weekend_minus_daily, social_share_screen, gaming_share_screen,
# screen_to_sleep)은 #181 화면 관계 블록과 정의가 같아 기존 등록을 재사용한다.
# #181은 CatBoost exp070 짝비교에서 7특성 블록이 -0.0000155로 기각된 전례이므로,
# 이 스크리닝의 질문은 "로그·스트레스 상호작용·참여 강도까지 합친 zhenrui 16열
# 묶음이 LightGBM 대리에서 양의 신호를 내는가"다.
# 판정 결과(2026-08-20): 기준 run 348ed829 0.9686372 → challenger(워크트리 run
# d9b2a061, 반입 run 090b4f5e) 0.9685733, delta -0.0000640, fold 승리 0/5, 카나리아
# 통과. 새 피처 gain은 비율·합 5열(social_share_screen, gaming_share_screen,
# activity_share_screen, total_screen, weekend_minus_daily)만 플라시보 상회, 로그·
# 스트레스 상호작용 등 11열 미달. 대리 스크리닝 미달로 파생 16열 축을 닫고 RealMLP
# 본실험을 열지 않는다. 이 설정과 파생 특성·검증 테스트는 기각 근거의 재현 기록으로
# 남긴다(#181·#62·#51의 비율 특성 기각과 같은 방향: 신호가 기존 fold-fit 블록에
# 이미 흡수되어 있다).
name: exp126_lgb_zhenrui_derived16

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names:
        [
          other_screen,
          screen_slack,
          total_screen,
          weekend_minus_daily,
          social_share_screen,
          gaming_share_screen,
          activity_total,
          activity_share_screen,
          screen_to_sleep,
          sleep_deficit,
          engagement_total,
          notif_per_app,
          log_notifications,
          log_app_opens,
          screen_per_app,
          screen_x_stress,
          social_x_stress,
          sleep_x_stress,
        ]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    n_estimators: 20000
    bagging_fraction: 0.7218730663234
    bagging_freq: 1
    cat_l2: 0.0296205152578
    cat_smooth: 0.0010255271303
    extra_trees: false
    feature_fraction: 0.4557131604374
    lambda_l1: 0.5219704038237
    lambda_l2: 0.1070959487853
    learning_rate: 0.0055891584996
    max_cat_to_onehot: 71
    min_data_in_leaf: 50
    min_data_per_group: 10
    num_leaves: 30
  fit:
    early_stopping_rounds: 200
