# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #51: 쌍 결합 TE·CE 탐색(#48 규약). 66쌍 약식 검증에서 유일하게
# 약식 기준 실행 대비 Δ ≥ +0.0001을 넘은 daily_screen_time_hours × weekend_screen_time.
# champion(exp011_resid_pair) 피처 + 쌍 TE + 쌍 CE + 쌍 카나리아 TE. seed 42 스크리닝.

name: exp017_pair_dst_wst

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack]
  pair_ce:
    - [daily_screen_time_hours, weekend_screen_time]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
          [daily_screen_time_hours, weekend_screen_time],
          [placebo_noise, weekend_screen_time],
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
