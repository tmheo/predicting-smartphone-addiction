# 이슈 #122: kitopl D2의 max_bin 외 저용량·규제·표본추출 설정 묶음을 이전하는 seed 42 대조.
# exp063과 같은 피처 계획과 전역 max_bin 1023을 유지하고 나머지 모델 설정만 바꾼다.
# seed 42 개선이 0 이상일 때만 3시드 확정 재검증과 후보 풀 판정을 연다.

name: exp074_lgb_kitopl_d2_bundle

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.03172214617330919
    num_leaves: 45
    min_child_samples: 229
    n_estimators: 10000
    max_bin: 1023
    colsample_bytree: 0.4654152088234655
    subsample: 0.9225106784455195
    subsample_freq: 1
    reg_lambda: 0.9179636700368584
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
