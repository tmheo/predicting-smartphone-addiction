# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #46: 생성기의 화면 시간 합계 제약을 산술 잔차로 표현하는 실험 3/3.
# other_screen과 screen_slack 계열 병행. 전성분 관측 행에서는 두 값이 같아 기여가
# 겹칠 수 있으므로, 단독 실험(exp007, exp008)과 비교해 중요도 잠식을 확인한다.
# champion(exp006_te_drop_gaming) 위에 세 컬럼을 더한다. seed 42 스크리닝.

name: exp009_resid_both

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack, screen_slack_n_obs]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
