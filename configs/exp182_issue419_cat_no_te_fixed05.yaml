# 이슈 #419: configs/exp071_cat_exact_no_te.yaml의 관측 학습 길이 15개 중앙값 4238 중
# 약 5%인 212회로 고정한다. 기준과의 변경은 조기 종료 해제와 반복 수뿐이다.
# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #107: 수동 TE를 정확값 범주로 교체한 변형(티켓 설계 4항).
# 첫 실행 exp070(run 980703ed)은 OOF +0.000075(0.968408 vs exp057 seed42 0.968333)로
# 기준 이상이었지만 새 범주 9열 중 6열이 플라시보 미달이라 이 교체 변형을 연다:
# 수동 TE와 범주 CTR이 같은 값별 목표 통계를 두 번 표현해 중요도가 갈라졌다는
# 가설의 분리 검사다. exp070에서 target_encoding 제공자만 뺐고 나머지는 동일하다
# (범주 복제 아홉 열 유지, max_ctr_complexity=1). 타깃 참조 제공자가 없어
# placebo 파생 카나리아는 없다(CatBoost 내부 CTR은 fold 학습 부분 안에서만 적합).
name: exp182_issue419_cat_no_te_fixed05

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: categorical_copies
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 212
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
    max_ctr_complexity: 1
  fit: {}
