# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #49 변형 1: 정확값 타깃 인코딩과 짝으로 쓰는 빈도 인코딩(CE).
# champion exp011_resid_pair 위에 TE와 같은 8개 컬럼의 CE를 추가한 seed 42 스크리닝.
# CE는 타깃을 쓰지 않아 placebo 카나리아 대상이 아니고, 새 피처 게이트(플라시보 대비)만 받는다.

name: exp012_ce

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: frequency_encoding
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
