# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #36: exp005(3시드)에서 gaming_hours_te만 3시드 모두 플라시보 importance에
# 근소 미달해 공식 판정이 막혔다. 해당 컬럼만 인코딩 대상에서 빼고 나머지 8개로 재실행.
# 미세 개선 경계 근처의 실험 계열이므로 처음부터 3시드 평균으로 돌린다.
# placebo_noise_te는 누수 카나리아 전용으로, 개선 판정의 새 피처에서 제외된다.

name: exp006_te_drop_gaming

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  fold_fit:
    - kind: target_encoding
      # 바깥쪽 학습 fold 안에서 내부 층화 10-fold OOF로 학습 행 인코딩. (#33)
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
