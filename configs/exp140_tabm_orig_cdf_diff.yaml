# 이슈 #295: 현재 TabM 풀 구성원 exp137에 원본 프록시 CDF 차이 5열만 더한 직접 교체 후보.
# 기준선과 모델 설정, 기존 피처 계획은 같고 original_cdf_diff 제공자 하나만 추가한다.
# seed 42 짝차이가 0 이상이면 [42, 43, 44] 확정 재검증으로 진행한다.
name: exp140_tabm_orig_cdf_diff

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_cdf_diff
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          daily_screen_time_hours,
          weekend_screen_time,
          social_media_hours,
          notifications_per_day,
          app_opens_per_day,
        ]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: true
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabm
  params:
    arch_type: tabm-mini-normal
    tabm_k: 16
    num_emb_type: pwl
    d_embedding: 16
    batch_size: 128
    lr: 5.0e-4
    n_epochs: 150
    dropout: 0.02
    d_block: 160
    n_blocks: 10
    weight_decay: 1.0e-2
    patience: 5
    n_seed_avg: 3
    perm_repeats: 2
    perm_sample: 50000
  fit: {}
