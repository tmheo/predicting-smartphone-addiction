# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #181: CatBoost 정확값 범주(exp070) 위에 화면 관계 7특성 블록을 추가해
# exp070의 풀 구성원 교체 여부를 판정한다. 레시피는 공개 스택 계보 조사
# (public-stack-provenance 3순위, beicicc fixed4000 계약)를 그대로 따른다:
# 차이 3개(gaming_minus_work, screen_minus_work, weekend_minus_daily)는 NaN 자연 전파,
# 비율 4개(social/gaming/work_share_screen, screen_to_sleep)는 분자·분모 유한·분모 양수일
# 때만 정의하고 epsilon·대체·클리핑·플래그를 쓰지 않는다.
# 모델 설정과 나머지 피처 계획은 exp070_cat_exact_cats와 동일하다. 짝지은 비교 기준:
# exp070 seed 42 run beec9a15(OOF 0.968408), 3시드 run 6238d8c5(OOF 0.968579).
# 판정 경로(#176·#181): LightGBM 대리 스크리닝 생략, seed 42 짝비교 문턱 +0.00002,
# 통과 시 3시드 확정 후 pipeline.pool 중복 게이트로 exp070 교체를 판정한다.
name: exp104_cat_exact_screen_relations

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: categorical_copies
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: derived
      names:
        [
          gaming_minus_work,
          screen_minus_work,
          weekend_minus_daily,
          social_share_screen,
          gaming_share_screen,
          work_share_screen,
          screen_to_sleep,
        ]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 10000
    depth: 6
    learning_rate: 0.05
    eval_metric: AUC
    max_ctr_complexity: 1
  fit:
    early_stopping_rounds: 200
