# 이슈 #300: exp124_realmlp_dtype_fix의 모형과 전처리는 그대로 두고 원본 프록시의
# 클래스별 경험적 CDF 차이 5열만 수치 입력으로 더한다. KDE 밀도비는 포함하지 않는다.
name: exp140_realmlp_orig_cdf_diff

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: original_cdf_diff
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          daily_screen_time_hours,
          weekend_screen_time,
          social_media_hours,
          notifications_per_day,
          app_opens_per_day,
        ]

model:
  kind: realmlp
  params:
    n_ens: 8
    embed_dim: 8
    onehot_thresh: 8
    hidden_dims: [512, 512, 512]
    dropout: 0.06
    p_drop_sched: expm4t
    pbld_hidden_dim: 20
    pbld_out_dim: 5
    pbld_freq_scale: 5.0
    pbld_lr_factor: 0.093
    lr: 0.01
    mom: 0.9
    sq_mom: 0.98
    lr_sched: flat_cos
    flat_ratio: 0.3
    first_layer_lr_factor: 1.0
    first_layer_wd_factor: 0.1
    lr_scale_mult: 10.0
    lr_bias_mult: 0.1
    weight_decay: 0.013
    wd_scale_mult: 0.1
    wd_bias_mult: 0.5
    ema_decay: 0.997875
    grad_clip: 1.2
    ls_eps: 0.04
    ls_eps_sched: cos
    tfms: [median_center, robust_scale]
    fixed_epochs: 4
    schedule_epochs: 8
    batch_size: 256
    eval_batch_size: 10240
    n_init_avg: 2
    init_seed_stride: 1000
    inner_folds: 5
    perm_sample: 8192
    perm_repeats: 1
    device: cuda
    verbosity: 1
  fit: {}
