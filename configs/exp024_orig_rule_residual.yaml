# 이슈 #52: 공개된 원본 daily/social 임계값 규칙의 로짓을 초기 점수로 준다.
# 0/1 극단값은 0.001/0.999로 잘라 유한한 로짓과 교정 가능한 기울기를 보장한다.
# 2단계는 champion exp011의 피처와 LightGBM 설정을 그대로 쓴다.
# 진단 실행(run 48de26a7)은 첫 두 fold AUC가 0.88454와 0.88843에 그쳤다.
# ±6.91 초기 로짓의 과도한 확신 때문에 틀린 원본 규칙을 2단계가 고치지 못해 중단했다.
# 실패 설정의 정확한 기록으로 보존하며 후보 풀 판정에는 쓰지 않는다.

name: exp024_orig_rule_residual

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

initial_score:
  kind: known_original_rule
  params:
    clip: 0.001

cv:
  seeds: [42]
