# 이슈 #387: exp108에 원본 프록시 최근접 1행 표현을 더한 정보 관점 변형.
name: exp154_issue387_logreg_nn1_nn10_l1
data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet
features:
  base: raw
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  providers:
  - kind: original_knn
    path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
    cols:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
    ks:
    - 1
    - 10
model:
  kind: logistic_onehot
  params:
    C: 10.0
    penalty: l1
    solver: liblinear
    max_iter: 1000
    onehot_max_card: 5000
  fit: {}
