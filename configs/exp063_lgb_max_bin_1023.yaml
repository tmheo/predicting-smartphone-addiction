# 이슈 #100: LightGBM 구간 수 확대 후보 1023의 seed 42 스크리닝.
# exp061과 같은 피처 계획과 모델 파라미터에서 max_bin만 바꾼다.
# seed 42 run b22d18c6, OOF AUC 0.9672690627, exp061 대비 +0.0000517393으로 후보 중 최고다.
# 현재 champion 공식 스크리닝은 -0.00125로 미달해 교체 대상은 아니며,
# 3시드 평균본으로 후보 풀 다양성과 이후 대리 기준 실행 채택 여부만 판정한다.

name: exp063_lgb_max_bin_1023

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    max_bin: 1023
    force_row_wise: true
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42, 43, 44]
