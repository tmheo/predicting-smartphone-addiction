# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #59: 트리 모델 계열 다양화 3탄 scikit-learn HistGradientBoosting.
# champion exp026과 동일한 피처 세트에서 학습기만 바꾼다. 용량은 champion을 비추는
# max_leaf_nodes 255, lr 0.05. 외부 eval set 조기 종료가 없어 학습 fold 내부 10%
# 분할로 조기 종료한다(검증 fold 누출 없음). importance는 검증 fold permutation
# importance(#59 코멘트 규약, adapter 소유).

name: exp042_hgb

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: hist_gradient_boosting
  params:
    max_iter: 10000
    max_leaf_nodes: 255
    learning_rate: 0.05
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 50
    scoring: loss
  fit: {}

cv:
  seeds: [42]
