# 이슈 #100: 원시 열의 최대 값 종류 수 1437을 넘기는 LightGBM 구간 수 후보.
# exp061과 같은 피처 계획과 모델 파라미터에서 max_bin만 바꾼다.
# seed 42 run 8f9d6026, OOF AUC 0.9672093587, exp061 대비 -0.0000079648로 꺾였다.
# 1023에서 최고점을 확인했으므로 2047 대조는 열지 않는다.

name: exp064_lgb_max_bin_1439

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    max_bin: 1439
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
