# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #61: TabM의 다양성 기여 결정(기본 구성).
# 원문(szymonkapiski, 단일 TabM OOF 0.96867)의 세 요소를 우리 fold 규율로 옮긴다.
# - TabM 하이퍼파라미터와 fold 내 3시드 평균(n_seed_avg)은 원문 그대로.
# - 제약 결측 재구성: 원문의 train+test 전체 iterative imputer 대신 채택된
#   fold-fit 제공자(constrained_impute_aux #74, xgb_impute_aux #86)를 쓴다.
# - 신경망 전용 비율 특성: 복원 행렬 조성 5열(#90 채택판)이 그 역할을 맡는다.
# - 격자 TE·빈도: 원문의 자기 포함 평활 TE와 조밀화·쌍 키 대신 내부 OOF 정확값
#   TE(champion 구성)를 쓴다. 빈도 인코딩(#49)·쌍 격자(#75)는 기각 계열이라 열지 않음.
# - 결측 지표·개수 열은 지도의 배제 경계라 만들지 않는다(원저자 ablation도 무효 보고).
# - 수치 열의 남은 NaN 중앙값 대체는 adapter가 학습 fold 통계로만 수행한다.
# 피처 세트는 champion 계열(exp057)과 동일해 학습기 차이만 판정한다.
# Kaggle GPU 실행 대상(docs/kaggle-gpu-run.md).
name: exp065_tabm

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabm
  params:
    arch_type: tabm-mini-normal
    tabm_k: 16
    num_emb_type: pwl
    d_embedding: 16
    batch_size: 128
    lr: 5.0e-4
    n_epochs: 150
    dropout: 0.02
    d_block: 160
    n_blocks: 10
    weight_decay: 1.0e-2
    patience: 5
    n_seed_avg: 3
    perm_repeats: 2
    perm_sample: 50000
  fit: {}
