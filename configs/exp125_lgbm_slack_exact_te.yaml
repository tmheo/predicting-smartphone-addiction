# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #195: 예산 잔차(screen_slack)의 정확값 표면을 champion 계열에 주기 전
# LightGBM 대리 게이트. 지문 실측(#88, #89)은 목표값이 잔차에 가장 가파르게
# 재결합됐다고 판정했는데, champion 계열은 잔차를 수치 표현으로만 받는다.
# 기준 실행 exp026 seed 42(run 4b6de022)에 screen_slack 정확값 TE 한 열만 더한
# 단일 델타 짝비교다. 모델 설정·나머지 피처 계획은 exp026과 동일하다.
# 판정: pipeline.compare --proxy-baseline 4b6de022 (대리 스크리닝, 문턱 개선 >= 0).
# 미달 시 GPU 변형(exp070 정확값 키, exp081 lookup_cols 확장) 없이 이슈를 닫는다.
name: exp125_lgbm_slack_exact_te

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          screen_slack,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
