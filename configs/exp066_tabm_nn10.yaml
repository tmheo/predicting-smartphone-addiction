# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #61 + #54 후속: 기본 구성(exp065)에 orig_nn10_mean 열 하나를 더한 변형.
# #54의 "orig_knn은 정확값 TE와 중복" 기각은 트리 모델 기준이라, 원시 컬럼에서
# k-이웃 라벨 평균 같은 국소 라벨 구조를 스스로 만들기 어려운 이 계열에서의
# 한계 기여를 별도 판정한다(#61 코멘트). 통계 원천은 #47 고정 프록시뿐이라
# outer fold 규율과 충돌하지 않는다. 다른 모든 구성은 exp065와 같다.
# Kaggle GPU 실행 대상(docs/kaggle-gpu-run.md).
name: exp066_tabm_nn10

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: original_knn
      path: data/external/Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      ks: [10]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: tabm
  params:
    arch_type: tabm-mini-normal
    tabm_k: 16
    num_emb_type: pwl
    d_embedding: 16
    batch_size: 128
    lr: 5.0e-4
    n_epochs: 150
    dropout: 0.02
    d_block: 160
    n_blocks: 10
    weight_decay: 1.0e-2
    patience: 5
    n_seed_avg: 3
    perm_repeats: 2
    perm_sample: 50000
  fit: {}
