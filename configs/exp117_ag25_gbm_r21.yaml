# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #197: AutoGluon zeroshot portfolio 2025의 GBM _r21 설정 이식.
# 출처: autogluon/autogluon(Apache-2.0) zeroshot_portfolio_2025.py,
# 커밋 2d7e6056b8b64dc44114faf652d4c99ec3c3770f. ag_args만 제거하고 파라미터는 원본 그대로.
# 피처 세트는 champion 계열(exp065_tabm과 동일)이라 학습기 설정 차이만 판정한다.
# 약식 검증(fold 0, seed 42): AUC 0.9678059, base_lgb 대비 +0.00094로 승격
# (docs/research/zeroshot-portfolio-2025-screen.md). best_iteration 9991로 10000 상한에
# 걸려 스크리닝은 n_estimators 20000으로 상한을 푼다.
name: exp117_ag25_gbm_r21

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    n_estimators: 20000
    bagging_fraction: 0.7218730663234
    bagging_freq: 1
    cat_l2: 0.0296205152578
    cat_smooth: 0.0010255271303
    extra_trees: false
    feature_fraction: 0.4557131604374
    lambda_l1: 0.5219704038237
    lambda_l2: 0.1070959487853
    learning_rate: 0.0055891584996
    max_cat_to_onehot: 71
    min_data_in_leaf: 50
    min_data_per_group: 10
    num_leaves: 30
  fit:
    early_stopping_rounds: 200
