# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #288: exp045 피처 계획을 고정하고 XGBoost 설정값 50회를 탐색한 최고 후보다.
# Optuna 시행 번호 15의 fold 0 AUC는 0.967598107191456이다.
# 최근접 풀 구성원은 exp117_ag25_gbm_r21이고 스피어만 상관은 0.9970331861750602다.
name: exp134_xgb_hpo_trial15

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: xgboost
  params:
    tree_method: hist
    eval_metric: auc
    n_estimators: 10000
    learning_rate: 0.018790426107537717
    max_depth: 4
    min_child_weight: 0.024018378390345006
    subsample: 0.8486490689521926
    colsample_bylevel: 0.9669553002922667
    colsample_bynode: 0.7696258523946379
    reg_alpha: 0.00023396465421627287
    reg_lambda: 0.04427766146328363
    grow_policy: depthwise
    max_cat_to_onehot: 54
    max_leaves: 192
  fit:
    early_stopping_rounds: 200
