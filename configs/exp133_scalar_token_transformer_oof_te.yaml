# 이슈 #286: exp115에 공개판 원래 12열의 내부 OOF 목표 평균만 추가한다.
# outer 학습 부분 안에서 10분할 OOF를 만들고 공개판과 같은 m=10 평활을 적용한다.
# 목표값을 참조하는 열의 카나리아로 placebo_noise_te를 함께 추가한다.
name: exp133_scalar_token_transformer_oof_te

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [screen_slack, sgw_sum, slack_frac, wk_minus_sgw, wk_other, sgw_frac]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions: [social_frac, work_frac, leisure_frac, resid_frac, week_total]
      cat_cols: [gender, stress_level, academic_work_impact]
    - kind: target_encoding
      inner_folds: 10
      smoothing: 10.0
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          gender,
          stress_level,
          academic_work_impact,
          placebo_noise,
        ]

model:
  kind: scalar_token_transformer
  params:
    mixing: attention
    perm_repeats: 1
  fit: {}
