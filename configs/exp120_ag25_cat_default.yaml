# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #197: AutoGluon zeroshot portfolio 2025의 CAT _default 설정 이식.
# 출처: autogluon/autogluon(Apache-2.0) zeroshot_portfolio_2025.py 커밋 2d7e6056와
# catboost/hyperparameters/parameters.py의 이진 분류 기본값(iterations 10000, lr 0.05).
# depth는 CatBoost 기본 6. eval_metric AUC와 early stopping 200은 저장소 규약.
# 피처 세트는 champion 계열(exp065_tabm과 동일)이라 학습기 설정 차이만 판정한다.
# 약식 검증(fold 0, seed 42): AUC 0.9676937, base_cat 대비 +0.00011. CAT 계열 5설정 중
# 최고 하나만 승격한다(docs/research/zeroshot-portfolio-2025-screen.md).
name: exp120_ag25_cat_default


data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 10000
    learning_rate: 0.05
    eval_metric: AUC
  fit:
    early_stopping_rounds: 200
