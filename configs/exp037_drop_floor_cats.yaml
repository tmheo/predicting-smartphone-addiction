# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #79: 플라시보 미달 피처 제거 변형 (a). 전 실행(29개)에서 gain importance가
# 플라시보보다 낮았던 raw 카테고리 3종(gender, stress_level, academic_work_impact)을
# features.exclude로 학습 행렬에서 뺀다. categorical 선언도 같이 비운다.
# 그 외는 champion exp026과 동일. 피처 제거 실험이라 새 피처 게이트는 해당 없음.
# seed 42 스크리닝(run f4c48b42)은 +0.00003으로 통과. 변형 3종 중 최고라
# 이 변형만 3시드 확정 재검증으로 보낸다(b는 +0.00001, c는 -0.00003 미달).
# 3시드 확정 재검증(run 007cab1f)은 +0.00001로 문턱(+0.0001) 미달 기각.
# 3/3 시드 미세 개선이라 제거 자체는 무해하지만 champion 교체 근거가 못 된다.
# 풀 등록도 하지 않음: champion run과 스피어만 0.99843으로 중복 게이트 발동,
# 등록하면 champion의 풀 항목을 교체하는데 앙상블 기여가 +0.00001뿐이다.

name: exp037_drop_floor_cats

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  exclude: [gender, stress_level, academic_work_impact]
  categorical: []
  providers:
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
    force_row_wise: true
  fit:
    early_stopping_rounds: 200
