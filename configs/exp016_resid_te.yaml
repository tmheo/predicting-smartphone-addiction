# 규약: 실험 하나 = 설정 파일 하나. 파일 이름이 곧 실험 이름의 접두어.
# 이슈 #49 추가 후보(#46 결의 파급): 파생 잔차 두 컬럼(other_screen, screen_slack)도
# 격자 값이므로 정확값 키 타깃 인코딩을 준다. 잔차 CE는 기본 8컬럼 CE 전패(전부 플라시보 미달,
# run 9a0fb9ad)로 전망이 약해 열지 않고 TE만 스크리닝한다. champion exp011_resid_pair 위 seed 42.

name: exp016_resid_te

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  include: raw
  categorical: [gender, stress_level, academic_work_impact]
  placebo: true
  derived: [other_screen, screen_slack]
  fold_fit:
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          other_screen,
          screen_slack,
          placebo_noise,
        ]

model:
  kind: lightgbm
  params:
    objective: binary
    metric: auc
    learning_rate: 0.05
    num_leaves: 255
    n_estimators: 10000
  fit:
    early_stopping_rounds: 200

cv:
  seeds: [42]
