# 이슈 #289의 GPU 설정값 탐색 25회에서 승격된 시행 22의 CPU 재검증 설정이다.
# exp070의 피처 계획은 그대로 유지하고 CatBoost 모델 설정만 고정한다.
name: exp133_cat_hpo_trial22

data:
  train: data/train.csv
  test: data/test.csv
  sample_submission: data/sample_submission.csv
  folds: artifacts/folds.parquet

features:
  base: raw
  categorical: [gender, stress_level, academic_work_impact]
  providers:
    - kind: categorical_copies
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: derived
      names: [other_screen, screen_slack]
    - kind: target_encoding
      inner_folds: 10
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
          placebo_noise,
        ]
    - kind: constrained_impute_aux
      widths: false
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
    - kind: xgb_impute_aux
      cols:
        [
          age,
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          sleep_hours,
          notifications_per_day,
          app_opens_per_day,
          weekend_screen_time,
        ]
      emit:
        [
          daily_screen_time_hours,
          social_media_hours,
          gaming_hours,
          work_study_hours,
          weekend_screen_time,
        ]
      compositions:
        [
          social_frac,
          work_frac,
          leisure_frac,
          resid_frac,
          week_total,
        ]
      cat_cols: [gender, stress_level, academic_work_impact]

model:
  kind: catboost
  params:
    iterations: 10000
    eval_metric: AUC
    max_ctr_complexity: 1
    boosting_type: Plain
    max_bin: 254
    bootstrap_type: Bernoulli
    learning_rate: 0.04135929497228879
    subsample: 0.9463496835047676
    grow_policy: SymmetricTree
    depth: 4
    l2_leaf_reg: 2.0450724960201474
    leaf_estimation_iterations: 2
    one_hot_max_size: 8
    model_size_reg: 0.5576665329695717
  fit:
    early_stopping_rounds: 200
