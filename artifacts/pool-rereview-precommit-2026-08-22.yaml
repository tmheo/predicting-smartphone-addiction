schema_version: 1
frozen_at: '2026-08-22'
ticket_issue: 341
map_issue: 338
purpose: >-
  35개 후보 풀의 실제 제거 결과를 보기 전에 영점 대조, 제거 대상, 조사 순서,
  판정, 난수, 결합 전략, 입력과 산출물 계약을 변경 불가 상태로 고정한다.
immutability:
  starts_before: null_band_measurement
  forbidden_after_start:
  - 후보 추가, 삭제 또는 이름 변경
  - 제거 대상 집합 추가, 삭제 또는 구성원 변경
  - 단계 순서, 정렬 열쇠 또는 동률 해소 변경
  - 판정 하한 축소 또는 결과를 본 뒤의 확대
  - 결합 전략 추가, 삭제, 순서 변경 또는 매개변수 변경
  - 난수, 반복 수, 분할, 중간 저장 단위 또는 산출물 필드 변경
  allowed_after_start:
  - 중간 저장 재개
  - 실행 실패 원인 기록 뒤 같은 입력과 계약으로 재실행
  - 기존 하한과 사전 고정한 영점 대조 하한 중 더 넓은 하한의 기계적 채택

