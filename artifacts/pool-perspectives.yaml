perspectives:
  raw_exact_values:
    label: 원시 정확값
    description: 원시 수치와 범주 값 자체를 희소 선형식 또는 학습형 기저로 표현한다.
  exact_value_target_statistics:
    label: 정확값 목표 통계
    description: 정확값별 목표 평균을 바깥쪽 학습 부분 안의 내부 OOF로 표현한다.
  arithmetic_relations:
    label: 화면 시간 산술 관계
    description: 화면 시간 합계, 잔차와 비율로 원시 열 사이의 산술 관계를 표현한다.
  original_proxy_neighbors:
    label: 원본 프록시 최근접 라벨
    description: 원본 프록시의 가까운 행에서 얻은 라벨 평균을 표현한다.
  original_proxy_initial_score:
    label: 원본 프록시 초기 점수
    description: 원본 프록시로 맞춘 목표 확률을 초기 점수로 두고 합성 자료 잔차를 학습한다.
  constrained_missing_reconstruction:
    label: 제약 결측 복원
    description: 화면 시간 예산 제약 안에서 결측값과 복원 구간 폭을 표현한다.
  original_proxy_value_priors:
    label: 원본 프록시 값별 사전 통계
    description: 원본 프록시의 정확값별 목표 평균을 합성 자료의 보조 좌표로 표현한다.
  pairwise_lattice_target_statistics:
    label: 쌍 격자 목표 통계
    description: 두 수치 열의 격자 셀별 목표 평균과 빈도를 표현한다.
  exact_value_lookup_geometry:
    label: 정확값 조회와 연속 좌표
    description: 정확값 조회 표현과 연속 수치 좌표를 함께 학습한다.
  learned_missing_reconstruction:
    label: 학습형 결측 복원과 조성
    description: 학습형 결측 복원값과 복원 행렬의 조성 관계를 함께 표현한다.
  native_exact_categories:
    label: 정확값 범주 복제
    description: 수치 정확값을 범주로 복제해 학습기 내부 목표 통계로 표현한다.
  transductive_value_geometry:
    label: 전처리 기준 집합의 값 좌표
    description: 훈련과 시험 설명변수를 전처리 기준 집합으로 삼아 정확값 어휘와 분위 좌표를 고정한다.
  exact_value_frequency:
    label: 정확값 빈도
    description: 목표값을 쓰지 않는 정확값별 출현 빈도를 표현한다.
  original_proxy_distribution_coordinates:
    label: 원본 프록시 분포 좌표
    description: 원본 프록시의 목표 범주별 경험적 누적분포 차이를 좌표로 표현한다.

